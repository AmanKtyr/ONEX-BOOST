{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | OneX-Fitness</title>

    <link rel="stylesheet" href="{% static 'vendors/mdi/css/materialdesignicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendors/css/vendor.bundle.base.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/customstyle.css' %}?v=3.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('{% static "images/login-bg.png" %}');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .error-wrapper {
            width: 100%;
            max-width: 480px;
            animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* Glassmorphism matching the login page */
        .error-card {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.75rem;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.25); }
            50%       { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
        }

        .error-icon-circle i {
            font-size: 2.5rem;
            color: #ffffff;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.75rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .error-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Matches login button */
        .btn-error-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #4599cd;
            color: #ffffff !important;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #4599cd;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(69, 153, 205, 0.35);
        }

        .btn-error-primary:hover {
            background: #3685b5;
            border-color: #3685b5;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(69, 153, 205, 0.45);
        }

        /* Matches login back web button */
        .btn-error-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff !important;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-error-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
        }

        .error-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .error-brand img {
            height: 36px;
            width: auto;
        }

        .error-brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<div class="error-wrapper">
    <div class="error-card">

        <div class="error-brand">
            <!-- You can point this to your full logo if you have one, or keep the favicon + text -->
            <img src="{% static 'images/favicon.png' %}" alt="OneX-Fitness">
            <span class="error-brand-name">OneX-Fitness</span>
        </div>

        <div class="error-icon-circle">
            <i class="mdi mdi-alert-circle-outline"></i>
        </div>

        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <p class="error-desc">
            The page you are looking for doesn't exist, has been moved, or you don't have access.
        </p>

        <div class="error-actions">
            <a href="{% url 'dashboard' %}" class="btn-error-primary">
                <i class="mdi mdi-home"></i> Dashboard
            </a>
            <a href="javascript:history.back()" class="btn-error-secondary">
                <i class="mdi mdi-arrow-left"></i> Go Back
            </a>
        </div>

    </div>
</div>

</body>
</html>
